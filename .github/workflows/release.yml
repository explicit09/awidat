name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: Montage-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            artifact_name: Montage-x86_64-apple-darwin
    # Both targets build on M-series runners; x86_64 is cross-compiled.
    # macos-15-intel hardware compiled ~2x slower (55m vs 30m for the same
    # code), signing/notarization are architecture-independent, and GitHub is
    # phasing Intel runners out.
    runs-on: macos-15
    env:
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          # Release runs failed repeatedly at post-compile steps (e.g. a
          # codesign timestamp-server flake after 112m of compiling) and the
          # default discards the cache on failure — so every retry started
          # cold. Save it regardless.
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Refuse missing release secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          scripts/release/check-required-env.sh \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD

      - name: Install desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Fetch desktop sidecars
        run: |
          make desktop-yt-dlp TARGET_TRIPLE=${{ matrix.target }}
          make desktop-ffmpeg TARGET_TRIPLE=${{ matrix.target }}
          make desktop-uv TARGET_TRIPLE=${{ matrix.target }}
          make desktop-rg TARGET_TRIPLE=${{ matrix.target }}
          make desktop-mcp-server TARGET_TRIPLE=${{ matrix.target }}

      - name: Fetch prebuilt codex sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        # The codex sidecar's compile closure (892 crates) is larger than the
        # app's and only changes when vendor/codex-rs or Cargo.lock changes.
        # codex-sidecar.yml prebuilds it per content hash; building it inline
        # cost 19-57 minutes per release leg. Falls back to building from
        # source if no prebuilt matches (e.g. first run after a vendor bump
        # before the prebuild workflow finishes) — but that fallback must be
        # LOUD: a silent multi-hour inline rebuild reads as "release is slow"
        # instead of "the prebuild cache is missing and codex-sidecar.yml
        # needs a look".
        run: |
          set -euo pipefail
          key="$(git rev-parse "HEAD:vendor/codex-rs" | cut -c1-12)-$(git hash-object Cargo.lock | cut -c1-12)"
          asset="codex-$key-${{ matrix.target }}"
          dest="apps/desktop/src-tauri/binaries/codex-${{ matrix.target }}"
          mkdir -p "$(dirname "$dest")"
          if gh release download codex-sidecar-cache --pattern "$asset" --output "$dest"; then
            chmod +x "$dest"
            echo "using prebuilt codex sidecar $asset"
          else
            msg="codex sidecar cache miss for $asset — inline rebuild (~20-60 min). Check codex-sidecar.yml run for the current Cargo.lock."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            make desktop-codex TARGET_TRIPLE=${{ matrix.target }} CODEX_PROFILE=release
          fi

      - name: Verify desktop sidecars
        run: scripts/release/verify-sidecars.sh ${{ matrix.target }}

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/release/import-apple-certificate.sh

      - name: Build signed DMG
        timeout-minutes: 90
        # `app` is requested alongside `dmg` because with `--bundles dmg`
        # alone tauri treats bundle/macos/Montage.app as an intermediate and
        # CLEANS it after the DMG is built — which made the later
        # "Verify desktop resources" step inspect a gutted .app and fail on
        # a missing Contents/Resources.
        #
        # At most ONE retry (two attempts total), not three: a blind 3x
        # retry silently masked how often this actually flakes. Attempt 1's
        # failure output is captured and echoed into both the log and the
        # job summary so flakes stay visible and countable instead of
        # disappearing into a green run. Before retrying, detach any stale
        # `dmg.*` volumes left mounted by the failed attempt — a stale
        # mount makes Finder's AppleEvent time out (-1712) on the next
        # hdiutil/Finder-driven DMG step, a known local failure mode.
        # codesign also reaches Apple's timestamp server, which flakes
        # independently (one such flake previously discarded a 112-minute
        # build); the retry reuses the warm target/, so only bundling and
        # signing rerun.
        run: |
          set -uo pipefail
          attempt1_log="$(mktemp)"
          if pnpm --dir apps/desktop tauri build --target ${{ matrix.target }} --bundles app,dmg 2>&1 | tee "$attempt1_log"; then
            exit 0
          fi
          echo "::warning::tauri build attempt 1 failed for ${{ matrix.target }}; capturing output and retrying once after detaching stale dmg volumes"
          {
            echo "### tauri build attempt 1 failed (${{ matrix.target }})"
            echo '```'
            tail -n 100 "$attempt1_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Detach any stale dmg.* (or other build-leftover) volumes before
          # retrying so the retry doesn't inherit a wedged mount. Each
          # mounted-volume line in `hdiutil info` starts with its own
          # slice device (e.g. `/dev/disk4s1`), so the device is column 1
          # of the same line the volume path appears on.
          while IFS= read -r stale_dev; do
            [ -n "$stale_dev" ] || continue
            echo "detaching stale volume on $stale_dev" >&2
            hdiutil detach "$stale_dev" -force || true
          done < <(hdiutil info | awk '/\/Volumes\/(dmg\.|Montage)/{print $1}')

          sleep 10
          if pnpm --dir apps/desktop tauri build --target ${{ matrix.target }} --bundles app,dmg; then
            exit 0
          fi
          echo "::error::tauri build failed after 2 attempts for ${{ matrix.target }}" >&2
          exit 1

      - name: Verify desktop resources
        run: scripts/release/verify-desktop-resources.sh "target/${{ matrix.target }}/release/bundle/macos/Montage.app"

      - name: Stage DMG
        run: |
          set -euo pipefail
          artifact_dir="release-artifacts"
          # montage-desktop (src-tauri) is a workspace member, so cargo
          # writes its bundle to the workspace-root target dir, not a
          # per-crate `apps/desktop/src-tauri/target/`.
          bundle_dir="target/${{ matrix.target }}/release/bundle/dmg"
          mkdir -p "$artifact_dir"
          dmg="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' | sort | head -n 1)"
          if [[ -z "$dmg" ]]; then
            echo "no DMG found in $bundle_dir" >&2
            exit 1
          fi
          cp "$dmg" "$artifact_dir/${{ matrix.artifact_name }}.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/notarize-dmg.sh "release-artifacts/${{ matrix.artifact_name }}.dmg"

      - name: Compute checksums
        run: scripts/release/checksums.sh release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/*
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.sha256' \) -exec cp {} release-assets/ \;
          required_assets=(
            Montage-aarch64-apple-darwin.dmg
            Montage-aarch64-apple-darwin.dmg.sha256
            Montage-x86_64-apple-darwin.dmg
            Montage-x86_64-apple-darwin.dmg.sha256
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -f "release-assets/$asset" ]]; then
              echo "missing required release asset: $asset" >&2
              exit 1
            fi
          done
          asset_list="$(mktemp)"
          find release-assets -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.sha256' \) \
            | sort > "$asset_list"
          diff -u <(printf '%s\n' "${required_assets[@]}" | sed 's#^#release-assets/#' | sort) "$asset_list"
          cat \
            release-assets/Montage-aarch64-apple-darwin.dmg.sha256 \
            release-assets/Montage-x86_64-apple-darwin.dmg.sha256 \
            > release-assets/checksums.txt
          ls -la release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
