# Bump the Homebrew Formula in explicit09/homebrew-awidat on each
# tagged release.
#
# Triggered by the `release.yml` workflow's published-release event;
# pulls the per-platform tarball SHA256s from the just-published
# release, rewrites dist/homebrew/awidat.rb in this repo, then
# pushes a new commit to the homebrew-awidat tap repo.
#
# One-time setup the user has to do manually:
#  1. Create a public repo at github.com/explicit09/homebrew-awidat
#     (Homebrew requires the `homebrew-` prefix for taps).
#  2. Create a fine-grained PAT with `contents: write` access to
#     that tap repo. Save it as a secret named HOMEBREW_TAP_TOKEN
#     in the awidat repo's Actions secrets.
#  3. Push the initial Formula by hand:
#        cp dist/homebrew/awidat.rb /path/to/homebrew-awidat/Formula/awidat.rb
#        cd /path/to/homebrew-awidat && git add . && git commit && git push
#     The auto-bump only edits an existing Formula file; it
#     does not create the repo structure for you.
#
# After one-time setup, end users can:
#   brew install explicit09/awidat/awidat
#
# Security: every github.event.* substitution flows through env vars
# rather than directly into run: blocks (the recommended pattern from
# the actions-security guide). HOMEBREW_TAP_TOKEN is the only
# external secret used.

name: homebrew-bump

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to bump the formula to (e.g. v0.2.0)'
        required: true

concurrency:
  group: homebrew-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: bump formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_TAG:-}" ]; then
            tag="$EVENT_TAG"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            echo "no tag provided" >&2
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch release SHAs
        id: shas
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt \
            --output checksums.txt
          extract() {
            local triple="$1"
            grep "awidat-${triple}.tar.gz" checksums.txt \
              | awk '{print $1}'
          }
          {
            echo "macos_arm_sha=$(extract aarch64-apple-darwin)"
            echo "macos_intel_sha=$(extract x86_64-apple-darwin)"
            echo "linux_arm_sha=$(extract aarch64-unknown-linux-gnu)"
            echo "linux_intel_sha=$(extract x86_64-unknown-linux-gnu)"
          } >> "$GITHUB_OUTPUT"

      - name: Rewrite formula
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          MACOS_ARM_SHA: ${{ steps.shas.outputs.macos_arm_sha }}
          MACOS_INTEL_SHA: ${{ steps.shas.outputs.macos_intel_sha }}
          LINUX_ARM_SHA: ${{ steps.shas.outputs.linux_arm_sha }}
          LINUX_INTEL_SHA: ${{ steps.shas.outputs.linux_intel_sha }}
        run: |
          set -euo pipefail
          ./dist/homebrew/bump-formula.sh dist/homebrew/awidat.rb \
            > dist/homebrew/awidat.bumped.rb
          mv dist/homebrew/awidat.bumped.rb dist/homebrew/awidat.rb
          cat dist/homebrew/awidat.rb

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: explicit09/homebrew-awidat
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Commit + push bump
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp dist/homebrew/awidat.rb homebrew-tap/Formula/awidat.rb
          cd homebrew-tap
          git config user.name "awidat-release-bot"
          git config user.email "noreply@github.com"
          git add Formula/awidat.rb
          if git diff --cached --quiet; then
            echo "No changes — formula already at latest."
            exit 0
          fi
          git commit -m "awidat $TAG"
          git push
