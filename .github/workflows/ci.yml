name: CI

on:
  pull_request:
  push:
    branches:
      - main

# CARGO_INCREMENTAL=0: CI never reuses an incremental build within a job, so the
#   incremental bookkeeping is pure overhead (~15-20%) and bloats target/.
# RUSTFLAGS debuginfo=0: smaller target/, faster links — CI doesn't debug.
# RUSTDOCFLAGS -D warnings: make `cargo doc` actually fail on broken intra-doc
#   links (the previous config compiled docs but never gated on warnings).
env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      # Pure-stdlib, ~60ms: the taste-corpus aligner tests ride the fast
      # job so they actually run in CI (a test target that CI never
      # invokes is not a gate — see the desktop test-chain lesson).
      - name: taste-corpus tests
        run: python3 -m unittest discover tools/taste-corpus

  security:
    name: Security hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: License and advisory check
        run: cargo deny check
      - name: Secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            dir /repo --config /repo/.gitleaks.toml --redact --exit-code=2 --no-banner --verbose

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS first because the v1 demo runs there; Linux for general CI
        # coverage (most contributors and CI runners default Linux).
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reclaim ~25-30 GB so clippy + test + doc can share a single target/
      # without running out of disk. This REPLACES the old `cargo clean` steps
      # between clippy/test/doc, which forced three full from-scratch rebuilds.
      - name: Free disk space
        if: matrix.os == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          # large-packages apt removal is slow (~2-3m); enable only if a build
          # still hits ENOSPC after the faster reclaims above.
          large-packages: false
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libcap-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      - name: Install macOS media dependencies
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg
      # The `v8` crate's build script downloads a prebuilt static lib from
      # GitHub releases; on a rust-cache miss that unauthenticated download
      # gets rate-limited on shared runner IPs and the whole job dies with
      # "could not find native static library rusty_v8" (4 consecutive
      # runs, 2026-07-25). Prefetch it with retries and hand the path to
      # the build script via RUSTY_V8_ARCHIVE so it never downloads.
      # (v8 reaches the graph via codex-core -> codex-code-mode; cutting
      # it entirely is tracked separately as a fork patch.)
      - name: Prefetch rusty_v8 static lib
        run: |
          set -euo pipefail
          V8_VERSION=$(grep -A1 '^name = "v8"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          case "${{ matrix.os }}" in
            macos-latest) TRIPLE=aarch64-apple-darwin ;;
            *)            TRIPLE=x86_64-unknown-linux-gnu ;;
          esac
          ARCHIVE="librusty_v8_release_${TRIPLE}.a.gz"
          URL="https://github.com/denoland/rusty_v8/releases/download/v${V8_VERSION}/${ARCHIVE}"
          echo "prefetching ${URL}"
          curl -sfL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "${RUNNER_TEMP}/${ARCHIVE}" "${URL}"
          echo "RUSTY_V8_ARCHIVE=${RUNNER_TEMP}/${ARCHIVE}" >> "${GITHUB_ENV}"
      - uses: Swatinem/rust-cache@v2
        with:
          # Stable key (not the per-job default) so the cache is reusable; one
          # cache per OS since macOS and Linux artifacts are incompatible.
          shared-key: rust-${{ matrix.os }}
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Fetch desktop sidecars
        run: make desktop-sidecar-check-stubs
      # Compute the vendored-crate excludes once and reuse across every cargo
      # invocation below (DRY — was duplicated in clippy/test/doc previously).
      - name: Compute vendored-crate excludes
        run: |
          set -euo pipefail
          excludes=""
          while IFS= read -r package; do
            excludes+=" --exclude $package"
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json, sys; data = json.load(sys.stdin); [print(p["name"]) for p in data["packages"] if "/vendor/" in p["manifest_path"]]'
          )
          echo "VENDOR_EXCLUDES=$excludes" >> "$GITHUB_ENV"

      # Linux runs the full gate (fmt/doc/whitespace + workspace clippy, whose
      # --all-targets also compile-checks examples). macOS bills 10x, so it
      # runs tests plus a targeted clippy over the crates that actually have
      # #[cfg(target_os = "macos")] code or are macOS-first (the desktop app,
      # keychain secrets, AVFoundation index/render paths)
      # — workspace-wide lint duplication stays off macOS. No `cargo clean`
      # anywhere — one warm target/ per job.
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace $VENDOR_EXCLUDES --all-targets -- -D warnings
      - name: Clippy (macOS-gated crates)
        if: matrix.os == 'macos-latest'
        run: |
          cargo clippy \
            -p montage-desktop \
            -p montage-index \
            -p montage-render \
            -p montage-secrets \
            --all-targets -- -D warnings
      # montage-desktop's #[test] suite is pure logic (mocked keychain
      # backend, wiremock HTTP servers, tempdir-backed IO — no AppHandle /
      # WebviewWindow construction, no macOS-only APIs beyond the
      # keyring backend swap already covered by the target-specific
      # deps above). It's no longer excluded here: fmt (job-wide) and
      # Clippy (both legs, see above) already cover it, so running its
      # tests on both OSes keeps that coverage symmetric instead of
      # leaving a gap only nextest carved out.
      - name: Test
        run: |
          set -euo pipefail
          export MONTAGE_FFMPEG="$(command -v ffmpeg)"
          export MONTAGE_FFPROBE="$(command -v ffprobe)"
          cargo nextest run --workspace $VENDOR_EXCLUDES
      - name: Doctests
        run: |
          set -euo pipefail
          export MONTAGE_FFMPEG="$(command -v ffmpeg)"
          export MONTAGE_FFPROBE="$(command -v ffprobe)"
          cargo test --doc --workspace $VENDOR_EXCLUDES
      - name: Doc
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --workspace $VENDOR_EXCLUDES
      - name: Whitespace
        if: matrix.os == 'ubuntu-latest'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [ -n "$PUSH_BEFORE_SHA" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

  desktop:
    name: Desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      # ffmpeg backs scripts/ssim-compare.sh, which the stage-harness visual
      # gate shells out to. Without it the gate cannot compare at all.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Playwright Chromium
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      - name: Export protocol bindings
        run: |
          MONTAGE_EXPORT_TS=1 cargo test -p montage-desktop-protocol
          perl -pi -e 's/[ \t]+$//' apps/desktop/src/protocol/generated/*.ts
      # `pnpm build:frontend` runs `tsc` against tsconfig.json before Vite. Keep the
      # type gate here instead of immediately repeating the same no-emit check.
      - name: Build and typecheck
        run: pnpm --dir apps/desktop build:frontend
      - name: Generated protocol unchanged
        run: git diff --exit-code -- apps/desktop/src/protocol/generated
      - name: UI smoke
        timeout-minutes: 10
        run: pnpm --dir apps/desktop test
      - name: Upload stage-harness screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-harness-screenshots
          path: apps/desktop/tests/smoke/stage-harness-*.png
          if-no-files-found: ignore
      - name: Python safe smoke
        run: python3 python/scripts/smoke_safe.py
