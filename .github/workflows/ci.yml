name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS first because the v1 demo runs there; Linux for general CI
        # coverage (most contributors and CI runners default Linux).
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libcap-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      - name: Install macOS media dependencies
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg
      - uses: Swatinem/rust-cache@v2
      - name: Fetch desktop sidecars
        run: make desktop-yt-dlp desktop-codex-check-stub
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          set -euo pipefail
          excludes=()
          while IFS= read -r package; do
            excludes+=(--exclude "$package")
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json, sys; data = json.load(sys.stdin); [print(p["name"]) for p in data["packages"] if "/vendor/" in p["manifest_path"]]'
          )
          cargo clippy --workspace "${excludes[@]}" --all-targets -- -D warnings
      - name: Free clippy build artifacts
        if: matrix.os == 'ubuntu-latest'
        run: cargo clean
      - name: Test
        run: |
          set -euo pipefail
          excludes=(--exclude montage-desktop)
          while IFS= read -r package; do
            excludes+=(--exclude "$package")
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json, sys; data = json.load(sys.stdin); [print(p["name"]) for p in data["packages"] if "/vendor/" in p["manifest_path"]]'
          )
          cargo test --workspace "${excludes[@]}"
      - name: Free test build artifacts
        if: matrix.os == 'ubuntu-latest'
        run: cargo clean
      - name: Doc
        run: |
          set -euo pipefail
          excludes=()
          while IFS= read -r package; do
            excludes+=(--exclude "$package")
          done < <(
            cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json, sys; data = json.load(sys.stdin); [print(p["name"]) for p in data["packages"] if "/vendor/" in p["manifest_path"]]'
          )
          cargo doc --no-deps --workspace "${excludes[@]}"
      - name: Whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [ -n "$PUSH_BEFORE_SHA" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

  desktop:
    name: Desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      - name: Export protocol bindings
        run: |
          MONTAGE_EXPORT_TS=1 cargo test -p montage-desktop-protocol
          perl -pi -e 's/[ \t]+$//' apps/desktop/src/protocol/generated/*.ts
      - name: Build
        run: pnpm --dir apps/desktop build
      - name: Generated protocol unchanged
        run: git diff --exit-code -- apps/desktop/src/protocol/generated
      - name: UI smoke
        timeout-minutes: 10
        run: pnpm --dir apps/desktop test
      - name: Python safe smoke
        run: python3 python/scripts/smoke_safe.py
