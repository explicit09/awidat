# Python workspace root for montage indexers.
#
# This is a `uv` workspace. Each indexer is its own package under
# `packages/<name>-mcp/`; `montage-mcp` is the shared library every indexer
# imports. Single lockfile, editable cross-package deps.
#
# To add a new indexer (e.g. for a v1.5 signal):
#   1. mkdir packages/myname-mcp && drop a pyproject.toml + src/.
#   2. List it under [tool.uv.workspace] members.
#   3. Add a `[[mcp.servers]]` entry to the montage config pointing at
#      `uv --directory python/packages/myname-mcp run myname-mcp`.
# No engine code changes — this is the data-not-code rule from
# `INDEX_SCHEMA.md`.

[project]
name = "montage-python-workspace"
version = "0.0.0"
description = "Workspace root — not installed."
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/montage-mcp",
    "packages/whisper-mcp",
    "packages/scenedetect-mcp",
    "packages/audio-energy-mcp",
    "packages/beats-mcp",
    "packages/topic-mcp",
    "packages/editorial-moments-mcp",
    "packages/clip-mcp",
    "packages/face-mcp",
    "packages/shot-mcp",
    "packages/gaze-mcp",
    "packages/frame-quality-mcp",
    "packages/color-analysis-mcp",
    "packages/composition-mcp",
]

[tool.uv.sources]
# Members reference each other by name; uv resolves them as workspace
# editable installs automatically. No path = needed.
montage-mcp = { workspace = true }
