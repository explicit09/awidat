[project]
name = "clip-mcp"
version = "0.1.0"
description = "Montage CLIP frame indexer — per-second image embeddings for visual search."
requires-python = ">=3.11"
dependencies = [
    "montage-mcp",
    # ViT-B-32 / OpenAI weights via the open-source open_clip lib.
    # Pinned-conservative; the model id we load is fixed below.
    "open-clip-torch>=2.24,<3",
    "torch>=2.2",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.scripts]
clip-mcp = "clip_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clip_mcp"]
