[project]
name = "scenedetect-mcp"
version = "0.1.0"
description = "Montage shot-boundary indexer (PySceneDetect content detector)."
requires-python = ">=3.11"
dependencies = [
    "montage-mcp",
    "scenedetect[opencv]>=0.6.7,<0.7",
]

[project.scripts]
scenedetect-mcp = "scenedetect_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scenedetect_mcp"]
