[project]
name = "shot-mcp"
version = "0.1.0"
description = "Awidat shot-type + camera-motion classifier (consumes scenedetect + face sidecars)."
requires-python = ">=3.11"
dependencies = [
    "awidat-mcp",
    # cv2 ships with scenedetect[opencv]; keep the dep here in case the
    # user runs without scenedetect-mcp installed.
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.scripts]
shot-mcp = "shot_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shot_mcp"]
