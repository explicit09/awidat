[project]
name = "face-mcp"
version = "0.1.0"
description = "Awidat face detection + speaker-to-face mapping indexer."
requires-python = ">=3.11"
dependencies = [
    "awidat-mcp",
    # Lightweight face detection + 128-dim recognition embeddings via dlib.
    # No torch required — keeps this indexer cheap and CPU-friendly.
    "face_recognition>=1.3,<2",
    "face-recognition-models",
    # face_recognition_models imports pkg_resources at runtime to
    # locate the bundled .dat files. pkg_resources was removed from
    # setuptools in 81+; pin to the last release that still ships it
    # until upstream face_recognition migrates to importlib.resources.
    "setuptools<81",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.scripts]
face-mcp = "face_mcp:main"

[tool.uv.sources]
# face-recognition-models is GitHub-only — no PyPI release.
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face_mcp"]
