[project]
name = "topic-mcp"
version = "0.1.0"
description = "Awidat topic-segmentation indexer (sentence-embedding boundaries + optional LLM labels)."
requires-python = ">=3.11"
dependencies = [
    "awidat-mcp",
    "sentence-transformers>=3,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# `claude` extra: enables Claude API for high-quality topic labels.
# Activate with `uv sync --package topic-mcp --extra claude`.
claude = ["anthropic>=0.40,<1"]
# `ollama` extra: enables local LLM labels via Ollama.
ollama = ["ollama>=0.5,<1"]

[project.scripts]
topic-mcp = "topic_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topic_mcp"]
