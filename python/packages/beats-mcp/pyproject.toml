[project]
name = "beats-mcp"
version = "0.1.0"
description = "Awidat musical beats indexer: tempo and beat-time detection for beat-sync editing."
requires-python = ">=3.11"
dependencies = [
    "awidat-mcp",
]

[project.scripts]
beats-mcp = "beats_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beats_mcp"]
