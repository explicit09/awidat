[project]
name = "editorial-moments-mcp"
version = "0.1.0"
description = "Awidat editorial-moments indexer — typed beats from whisper + topic + audio-energy sidecars via Claude Haiku."
requires-python = ">=3.11"
dependencies = [
    "awidat-mcp",
    "anthropic>=0.40,<1",
    "pydantic>=2,<3",
]

[project.scripts]
editorial-moments-mcp = "editorial_moments_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/editorial_moments_mcp"]
