[project]
name = "composition-mcp"
version = "0.1.0"
description = "Awidat composition indexer - model-style framing labels for shot sidecars."
requires-python = ">=3.11"
dependencies = [
    "awidat-mcp",
]

[project.scripts]
composition-mcp = "composition_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/composition_mcp"]
