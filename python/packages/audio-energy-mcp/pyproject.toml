[project]
name = "audio-energy-mcp"
version = "0.1.0"
description = "Awidat audio energy indexer: RMS over windows, integrated LUFS, silence detection."
requires-python = ">=3.11"
dependencies = [
    "awidat-mcp",
    "numpy>=1.26,<3",
    "pyloudnorm>=0.1.1,<0.3",
]

[project.scripts]
audio-energy-mcp = "audio_energy_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_energy_mcp"]
