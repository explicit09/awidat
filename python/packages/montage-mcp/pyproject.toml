[project]
name = "montage-mcp"
version = "0.1.0"
description = "Shared library for Montage MCP indexers (sidecar header, sha256, FastMCP serve helper)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/montage_mcp"]
