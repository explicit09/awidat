[project]
name = "color-analysis-mcp"
version = "0.1.0"
description = "Awidat color-analysis indexer — per-frame color/exposure metrics and correction recommendations."
requires-python = ">=3.11"
dependencies = [
    "awidat-mcp",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.scripts]
color-analysis-mcp = "color_analysis_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
