[project]
name = "gaze-mcp"
version = "0.1.0"
description = "Montage gaze indexer — looking-at-camera vs off-camera per face per frame."
requires-python = ">=3.11"
dependencies = [
    "montage-mcp",
    "face_recognition>=1.3,<2",
    "face-recognition-models",
    "setuptools<81",
    "numpy>=1.26",
]

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }

[project.scripts]
gaze-mcp = "gaze_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze_mcp"]
