[package]
name = "awidat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "awidat_core"
path = "src/lib.rs"

[dependencies]
awidat-proto = { workspace = true }
awidat-secrets = { workspace = true }
awidat-index = { workspace = true }
awidat-render = { workspace = true }
awidat-effects = { workspace = true }
awidat-lut = { workspace = true }
awidat-config = { workspace = true }
awidat-mcp = { workspace = true }
awidat-sandboxing = { workspace = true }
# Server-side rmcp for the in-process Awidat MCP server (codex
# registers it via [mcp_servers.awidat] and spawns it as a child
# process over stdio). Features mirror crates/mcp's client features;
# the macros feature wants "server" + "schemars" + "base64" because
# rmcp 0.15's model/tool.rs references handler::server unconditionally.
rmcp = { workspace = true, features = ["server", "macros", "schemars", "base64", "transport-io"] }
# Direct schemars 1.x dep for the JsonSchema derive on MCP tool
# argument structs. rmcp 0.15 depends on schemars 1.x; the workspace
# pin is schemars 0.8.22 for codex compatibility, so this is a per-
# crate override. We don't surface schemars types in our public API
# so the version split is contained to this crate.
schemars = "1.2.1"
vedit-core = { workspace = true }
dirs = { workspace = true }
base64 = "0.22"
sha2 = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
bm25 = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
