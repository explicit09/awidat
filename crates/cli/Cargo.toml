[package]
name = "awidat-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "awidat"
path = "src/main.rs"

# Awidat MCP server, spawned as a child process by codex (or any other
# MCP client). See crates/core/src/awidat_mcp/mod.rs for the server
# definition. Step 3 of the codex-harness migration ships this with
# one stub tool; step 5 ports the ~100 video tools onto it.
[[bin]]
name = "awidat-mcp-server"
path = "src/bin/awidat-mcp-server.rs"

[dependencies]
awidat-proto = { workspace = true }
awidat-config = { workspace = true }
awidat-core = { workspace = true }
awidat-index = { workspace = true }
awidat-mcp = { workspace = true }
awidat-render = { workspace = true }
awidat-tui = { workspace = true }
awidat-secrets = { workspace = true }
# Hello-world spine for the codex-harness migration. `chat-codex` is
# a temporary subcommand that drives the vendored codex agent loop
# end-to-end against an OpenAI key with zero Awidat tools registered.
# It proves the integration and goes away once `tui`/`chat` are
# rewired in step 7 of the migration plan.
codex-exec = { workspace = true }
codex-arg0 = { workspace = true }
codex-utils-cli = { workspace = true }
codex-login = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["io-std", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde_json = { workspace = true }
# Needed by the awidat-mcp-server binary for ServiceExt and the stdio
# transport entrypoint. Feature set mirrors crates/core's rmcp dep.
rmcp = { workspace = true, features = ["server", "macros", "schemars", "base64", "transport-io"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
