[package]
name = "montage-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "montage"
path = "src/main.rs"

# Montage MCP server, spawned as a child process by codex (or any other
# MCP client). See crates/core/src/montage_mcp/mod.rs for the server
# definition and current Montage tool router.
[[bin]]
name = "montage-mcp-server"
path = "src/bin/montage-mcp-server.rs"

[dependencies]
montage-proto = { workspace = true }
montage-config = { workspace = true }
montage-core = { workspace = true }
montage-index = { workspace = true }
montage-mcp = { workspace = true }
montage-render = { workspace = true }
montage-secrets = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["io-std", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Needed by the montage-mcp-server binary for ServiceExt and the stdio
# transport entrypoint. Feature set mirrors crates/core's rmcp dep.
rmcp = { workspace = true, features = ["server", "macros", "schemars", "base64", "transport-io"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
