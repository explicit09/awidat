[package]
name = "awidat-social-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "awidat-social-server"
path = "src/main.rs"

[dependencies]
awidat-social = { workspace = true }
# Axum: workspace dep is default-features=false; we add the features we need (G1).
axum = { workspace = true, features = ["http1", "tokio", "json"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
# r2d2 and postgres come transitively via awidat-social; re-declare here so
# main.rs can use them directly when building the pool.
r2d2 = { workspace = true }
r2d2_postgres = { workspace = true }
postgres = { workspace = true }

[lints]
workspace = true
