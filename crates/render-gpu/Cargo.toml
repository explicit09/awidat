bytemuck = { workspace = true }
thiserror = { workspace = true }
# Minimal PNG encoder for the preview path: takes an RGBA buffer and
# emits a `data:image/png;base64,…` payload the desktop sends to the
# webview as the source of an <img> overlay. We only need encoding,
# not decoding or any other format support — the `png` crate is the
# lighter dep next to `image`.
png = "0.17"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
