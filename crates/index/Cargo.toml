[package]
name = "montage-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "montage_index"
path = "src/lib.rs"

[[bin]]
name = "montage-index-perf"
path = "src/bin/montage-index-perf.rs"

[[bin]]
name = "montage-index-skip-perf"
path = "src/bin/montage-index-skip-perf.rs"

[dependencies]
montage-proto = { workspace = true }
montage-mcp = { workspace = true }
montage-config = { workspace = true }
montage-secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread"] }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
montage-test-support = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
