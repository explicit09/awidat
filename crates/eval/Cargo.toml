[package]
name = "awidat-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "awidat-eval"
path = "src/main.rs"

[lib]
name = "awidat_eval"
path = "src/lib.rs"

[dependencies]
awidat-core = { workspace = true }
awidat-proto = { workspace = true }
awidat-render = { workspace = true }
awidat-mcp = { workspace = true }
awidat-test-support = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
tokio-util = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
