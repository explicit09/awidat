[package]
name = "awidat-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Awidat MCP client (stdio JSON-RPC). Speaks Model Context Protocol — used by every indexer (Week 2) and every agent tool (Week 4+)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "macros", "rt"] }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread"] }

[[test]]
name = "client_against_test_server"
path = "tests/client_against_test_server.rs"
harness = true

# A tiny in-tree MCP server we drive from integration tests. It speaks real
# MCP over stdio so the client is exercised against the actual protocol, not
# a mock.
[[bin]]
name = "awidat-mcp-test-server"
path = "tests/test-server/main.rs"
test = false
doc = false
required-features = []
