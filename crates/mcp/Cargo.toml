[package]
name = "montage-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "montage_mcp"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "macros", "rt"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process", "macros", "server", "schemars", "base64"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "macros", "rt", "rt-multi-thread"] }
tokio-util = { workspace = true }
montage-test-support = { workspace = true }

[[test]]
name = "client_against_test_server"
path = "tests/client_against_test_server.rs"
harness = true

# A tiny in-tree MCP server we drive from integration tests. It speaks real
# MCP over stdio so the client is exercised against the actual protocol, not
# a mock.
[[bin]]
name = "montage-mcp-test-server"
path = "test-server/src/main.rs"
test = false
doc = false
required-features = []

[lints]
workspace = true
