[package]
name = "awidat-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "awidat_tui"
path = "src/lib.rs"

[dependencies]
awidat-core = { path = "../core" }
awidat-proto = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }
derive_more = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }

# This crate intentionally does NOT inherit workspace lints. The
# workspace forbids `unsafe_code` (which can't be relaxed by `allow`),
# but we need narrow libc::{dup, fcntl, poll, read} calls in
# terminal_probe.rs to implement a 100ms-bounded cursor probe — the
# stock crossterm helper waits two seconds and crashes the TUI on
# slow terminals (macOS Terminal under load). We mirror the
# workspace's other lints below and only differ by demoting
# `unsafe_code` to `deny` so the probe module can `#![allow(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"
