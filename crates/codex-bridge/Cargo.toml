[package]
name = "montage-codex-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codex app-server bridge for Montage surfaces"

[features]
default = []
in-process-codex = [
    "dep:codex-app-server-client",
    "dep:codex-app-server-protocol",
    "dep:codex-config",
    "dep:codex-core",
    "dep:codex-protocol",
    "dep:codex-arg0",
    "dep:codex-feedback",
]

[lib]
name = "montage_codex_bridge"

[dependencies]
# Desktop wire protocol — the `Item` types we emit.
montage-desktop-protocol = { workspace = true }

# Codex app-server in-process client + protocol types.
# These stay optional so default desktop builds use the external app-server
# binary and do not compile the vendored Codex Rust graph.
codex-app-server-client = { workspace = true, optional = true }
codex-app-server-protocol = { workspace = true, optional = true }
codex-config = { workspace = true, optional = true }
codex-core = { workspace = true, optional = true }
codex-protocol = { workspace = true, optional = true }
codex-arg0 = { workspace = true, optional = true }
codex-feedback = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
