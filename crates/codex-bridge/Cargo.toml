[package]
name = "montage-codex-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codex app-server bridge for Montage surfaces"

[lib]
name = "montage_codex_bridge"

[dependencies]
# Desktop wire protocol — the `Item` types we emit.
montage-desktop-protocol = { workspace = true }

# Lightweight helper for locating the Codex home and patched model catalog.
codex-utils-home-dir = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
