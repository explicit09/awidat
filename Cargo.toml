[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/tools",
    "crates/mcp",
    "crates/sandboxing",
    "crates/tui",
    "crates/cli",
    "crates/render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Awidat Authors"]
license = "Apache-2.0"
repository = "https://github.com/awidat/awidat"

# Centralized lints: every crate inherits via `[lints] workspace = true` in
# its Cargo.toml. New crates added later get the same treatment by default,
# avoiding the per-file `#![warn(clippy::pedantic)]` boilerplate that drifts
# between crates.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
large_enum_variant = "allow"
manual_let_else = "allow"

[workspace.dependencies]
# Crates we own.
awidat-proto = { path = "crates/proto" }
awidat-core = { path = "crates/core" }
awidat-tools = { path = "crates/tools" }
awidat-mcp = { path = "crates/mcp" }
awidat-sandboxing = { path = "crates/sandboxing" }
awidat-tui = { path = "crates/tui" }
awidat-render = { path = "crates/render" }

# External (locked per Week 1 prompt).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
