# vedit-core: content-addressed object store + structured diff/merge for
# OTIO timelines. Pinned to a specific commit because vedit is under
# active development and we don't want surprise API churn. Bump
# deliberately, with a probe-test, the way we'd bump any external dep.
# See PLAN.md for the vedit integration rationale.
vedit-core = { git = "https://github.com/explicit09/vedit.git", rev = "23a2bbc9cd2ac11e68988bf27d6c0094ac29975e" }

# External — merged from Montage + codex. Conflicts resolved per the
# table in the codex-adoption plan (lets-plan-golden-crystal.md).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = "4"
clap_complete = "4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-stream = "0.1.18"
tokio-test = "0.4"
tokio-util = { version = "0.7.18", default-features = false }
# Downgraded from rmcp 1.x to 0.15.0 to match codex. crates/mcp will be
# replaced by codex-rmcp-client in a later step; the brief porting cost
# is cheaper than keeping two rmcp majors in the workspace.
rmcp = { version = "0.15.0", default-features = false }
anyhow = "1"
thiserror = "2.0.17"
chrono = { version = "0.4.43", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-appender = "0.2.3"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = "0.3.22"
tracing-test = "0.2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "cookies", "multipart"] }
eventsource-stream = "0.2.3"
async-stream = "0.3.6"
async-trait = "0.1.89"
async-channel = "2.3.1"
async-io = "2.6.0"
bytes = "1.10.1"
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
toml = { version = "0.9.5", default-features = false, features = ["parse", "display", "serde"] }
toml_edit = "0.24.0"
serde_yaml = "0.9"
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"
serde_with = "3.17"
bm25 = "2.3.2"
sha1 = "0.10.6"
sha2 = "0.10"
shlex = "1.3.0"
keyring = { version = "3.6", default-features = false, features = ["crypto-rust"] }
