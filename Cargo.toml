# Sync Postgres client + blocking connection pool for PgSocialStore (D1).
# The domain crate (montage-social) stays synchronous; the async server shell
# calls it via spawn_blocking.  Do not add the sqlx postgres backend here.
postgres = { version = "0.19", features = ["with-serde_json-1"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"

# cargo-shear cannot see the platform-specific openssl-sys usage and a
# few codex helpers, so we silence those false positives here instead of
# deleting a real dependency. Lifted from upstream codex.
[workspace.metadata.cargo-shear]
ignored = [
    "codex-agent-graph-store",
    "codex-goal-extension",
    "icu_provider",
    "openssl-sys",
    "codex-v8-poc",
]

[profile.dev]
# Disk-constrained machines: this monorepo vendors all of codex-rs (~1484
# crates), so a debug `target/` runs 14G+ and repeatedly fills the disk. Drop
# debug info entirely + strip symbols to cut target/debug by ~30-50%. Trade-off:
# backtraces lose line numbers (use the `profiling` profile when you need them).
debug = "none"
strip = "symbols"

[profile.dev-small]
# Codex's "fast iterate" dev profile.
inherits = "dev"
opt-level = 0
debug = "none"
strip = "symbols"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
# Codex profile for sampling profilers: release-shaped binary with
# full debug info preserved and LTO disabled for faster recompiles.
inherits = "release"
debug = "full"
lto = false
strip = false

# CI test binaries (esp. montage-render-gpu with the full wgpu graph) link
# into objects so large with the default `debuginfo=2` that ubuntu-latest
# GitHub runners regularly hit `ld: Bus error` / disk-full during the link
# phase. Cutting test debuginfo to line tables only keeps useful panic
# backtraces while shrinking the linked output substantially.
[profile.test]
debug = "line-tables-only"

[profile.ci-test]
# Codex CI profile — smaller debug info, no optimization.
debug = "limited"
inherits = "test"
opt-level = 0

# Patches inherited from the codex fork. These point at openai-oss-forks
# of crossterm/ratatui/tokio-tungstenite/tungstenite that add a few
# features (notably the `proxy` feature on tokio-tungstenite) the
# upstream crates don't carry. Montage's old TUI consumed plain crates.io
# crossterm/ratatui; switching it to the fork during the transition is
# acceptable because crates/tui/ is slated for deletion once codex's TUI
# takes over.
[patch.crates-io]
crossterm = { git = "https://github.com/nornagon/crossterm", rev = "87db8bfa6dc99427fd3b071681b07fc31c6ce995" }
ratatui = { git = "https://github.com/nornagon/ratatui", rev = "9b2ad1298408c45918ee9f8241a6f95498cdbed2" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
