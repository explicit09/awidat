[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/tools",
    "crates/mcp",
    "crates/sandboxing",
    "crates/tui",
    "crates/cli",
    "crates/render",
    "crates/test-support",
    "crates/config",
    "crates/secrets",
    "crates/index",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Awidat Authors"]
license = "Apache-2.0"
repository = "https://github.com/awidat/awidat"

# Centralized lints: every crate inherits via `[lints] workspace = true` in
# its Cargo.toml. New crates added later get the same treatment by default.
#
# Philosophy lifted from `harnesses/codex/codex-rs/Cargo.toml`: we prefer
# enabling specific lints that catch real bugs (`unwrap_used`,
# `await_holding_lock`, `redundant_clone`) over enabling `clippy::pedantic`
# wholesale, which mostly produces style noise. Add new lints when they earn
# their keep on a real bug.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[workspace.dependencies]
# Crates we own.
awidat-proto = { path = "crates/proto" }
awidat-core = { path = "crates/core" }
awidat-tools = { path = "crates/tools" }
awidat-mcp = { path = "crates/mcp" }
awidat-sandboxing = { path = "crates/sandboxing" }
awidat-tui = { path = "crates/tui" }
awidat-render = { path = "crates/render" }
awidat-config = { path = "crates/config" }
awidat-secrets = { path = "crates/secrets" }
awidat-index = { path = "crates/index" }

# External (locked per Week 1 prompt).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
rmcp = { version = "1", default-features = false, features = ["client", "transport-child-process", "macros"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
pretty_assertions = "1"
tempfile = "3"
awidat-test-support = { path = "crates/test-support" }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
sha2 = "0.10"
# Real bug found in production: keyring 3.x ships with no platform
# backend by default — `set_password` silently accepts then drops the
# value, `get_password` returns NoEntry. The user sees "stored 108
# chars" and then "ANTHROPIC_API_KEY not set in env or keychain" on
# the next call. Per keyring 3.x docs we have to opt in to native
# backends explicitly. `apple-native` = Security Framework on macOS,
# `windows-native` = Credential Manager on Windows,
# `linux-native-sync-persistent` = Secret Service on Linux,
# `sync-secret-service` = the fallback used inside that.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "sync-secret-service"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
dirs = "6"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["events", "event-stream", "bracketed-paste"] }
libc = "0.2"
unicode-width = "0.2"
derive_more = { version = "1", default-features = false, features = ["is_variant"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
