libc = "0.2.182"
unicode-width = "0.2"
unicode-segmentation = "1.12.0"
derive_more = { version = "2", default-features = false, features = ["is_variant"] }
# GPU rendering for transitions. wgpu picks the best available backend
# at runtime (Metal on macOS, Vulkan/DX12/GL elsewhere); we keep wgpu's
# default features so all those backends compile in. pollster is the
# trivial executor we use to block on wgpu's async setup. bytemuck lets
# us cast plain-data uniform structs into byte slices for wgpu without
# unsafe code in callers.
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }

