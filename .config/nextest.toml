# Workspace-level nextest configuration.
#
# Used by CI's `cargo nextest run --workspace $VENDOR_EXCLUDES` (run from the
# repo root, so this file — not vendor/codex-rs/.config/nextest.toml — applies).

[[profile.default.overrides]]
# progress_notifications_are_routed_to_subscriber exercises rmcp 1.8's progress
# routing end to end against a child MCP server. rmcp 1.8 dispatches each
# `notifications/progress` frame on an independent `tokio::spawn`ed task
# (rmcp-1.8.0/src/service.rs:1228, inside the third-party crate we do not fork).
# The test runs on the default current-thread `#[tokio::test]` runtime, so that
# spawned delivery task shares one OS thread with the test body. Under a fully
# saturated box — CI runs ~2775 tests concurrently — the OS can starve this
# test's single runtime thread long enough that the delivery task never gets
# CPU before the client's completion wait times out, and the subscriber is torn
# down having received nothing ("got 0" at exactly the 10s cap). The delivery
# spawn is upstream of our handler in vendored rmcp, so no client-side wait can
# close this under total starvation.
#
# `threads-required = "num-cpus"` makes nextest schedule this one test alone
# (reserving every slot), so it is not competing with the rest of the workspace
# for its runtime thread's CPU time. This is honest isolation for a test whose
# timing is load-sensitive by construction, not a masked failure — the routing
# logic itself is covered and passes; only the co-scheduling starvation is
# removed. (Same class of fix as vendor/codex-rs/.config/nextest.toml's
# single-thread test-groups for its own integration tests.)
filter = 'test(progress_notifications_are_routed_to_subscriber)'
threads-required = 'num-cpus'
