    <script type="module">
      import React from "react";

      import App from "/src/App.tsx";
      import { useAgentStore } from "/src/agent/store.ts";
      import { useTimelineSelectionStore } from "/src/properties/store.ts";
      import { useProposalStore } from "/src/timeline/proposal.ts";

      const params = new URLSearchParams(window.location.search);
      const projectLoaded = params.get("project") === "1";
      const scenario = params.get("scenario") || "shell";
      const projectRoot = "/tmp/awidat-ui-eval";

      const timeline = {
        duration_s: 18,

        preview_limitations: [

                split_edit_confidence: 0.87,
              },
              {

              },
              {

                has_video: true,
                has_audio: true,
                color_correction: null,
                lut_path: null,
                title: null,
                video_overlay: null,
                audio_lead_s: null,

                split_edit_reason: "Hold dialogue under the incoming reaction.",

              },
              {

              {

              },
              {
                kind: "transition",

                out_offset_s: 0.25,
                effect_name: "awidat.flash_white",
                transition_id: "awidat.flash_white",

              },
              {
                kind: "clip",
                index: 6,
                name: "Outro",
                clip_uuid: "clip-4",
                track_start_s: 14,
                duration_s: 4,
                asset_id: "raw/outro.mp4",
                source_start_s: 1,
                proxy_path: null,
                thumbnail_dir: null,
                waveform_path: null,
                volume: null,
                speed: null,

                has_audio: true,

                audio_trail_s: null,
                split_edit_reason: null,
                split_edit_confidence: null,
              },
            ],
          },
        ],
      };

      const notes = {
        version: 1,
        notes: [
          {
            id: "broll-1",
            kind: "broll_suggestion",
            status: "open",
            anchor_at_s: 3.2,
            summary: "Add city skyline cutaway",
            broll_query: "city skyline",
            broll_anchor: { kind: "clip_uuid", uuid: "clip-1" },
            broll_previews: [
              {
                pexels_id: 42,
                thumbnail_url:
                  "data:image/gif;base64,R0lGODlhAQABAAAAACw=",
                pexels_page: "https://example.invalid/pexels/42",
                attribution: "Pexels",
                duration_s: 3,
              },
            ],
          },
        ],
      };

      const commits = [
        {
          commitHash: "sha256:bbbbbbbbbbbbbbbb",
          timelineHash: "sha256:timeline2",
          timestamp: "2026-05-11T12:05:00Z",
          header: "Tighten intro",
          fullMessage: "Tighten intro\n\nAgent reasoning: remove dead air",
          parents: ["sha256:aaaaaaaaaaaaaaaa"],
        },
        {
          commitHash: "sha256:aaaaaaaaaaaaaaaa",
          timelineHash: "sha256:timeline1",
          timestamp: "2026-05-11T12:00:00Z",
          header: "Clean starting cut",
          fullMessage: "Clean starting cut",
          parents: [],
        },
      ];

      mockWindows("main");
      mockConvertFileSrc("macos");
      window.__lastEdlText = "";
      let proposalCounter = 0;
      mockIPC((cmd, args) => {
        switch (cmd) {
          case "current_project_root":
            return projectLoaded ? projectRoot : null;
          case "recent_projects":
            return projectLoaded ? [projectRoot] : [];
          case "read_timeline":
            return timeline;
          case "list_notes":
            return notes;
          case "list_proxies":
            return [];
          case "read_transcript":
            return null;
          case "list_chat_sessions":
            return [];
          case "load_chat_history":
            return { items: [] };
          case "list_vedit_commits":
            return commits;
          case "diff_vedit_refs":
            return {
              fromRef: "sha256:aaaaaaaaaaaaaaaa",
              toRef: "sha256:bbbbbbbbbbbbbbbb",
              changeCount: 1,
              changes: [{ kind: "Trimmed", clip_uuid: "clip-1" }],
            };
          case "restore_vedit_ref":
          case "set_menu_item_enabled":
          case "set_view_state":
          case "start_turn":
            return null;
          case "accept_proposal":
          case "reject_proposal":
            useProposalStore.getState().clear();
            return null;
          case "propose_user_edit":
            window.__lastEdlText = args?.edlText ?? "";
            proposalCounter += 1;
            const proposalId = `proposal-ui-test-${proposalCounter}`;
            useProposalStore.getState().ingest({
              kind: "proposed_edit",
              id: proposalId,
              phase: "started",
              source: { source: "user" },
              edl_text: window.__lastEdlText,
              snapshot: timeline,
              diff_hints: [],
              summary: "Assessor recommendation",
              revision: 0,
            });
            return proposalId;
          case "get_permission_mode":
            return "ask";
          case "get_project_type":
            return "editorial";
          default:
            return null;
        }
      }, { shouldMockEvents: true });

      function seedProposal() {
        useProposalStore.getState().ingest({
          kind: "proposed_edit",
          id: "proposal-1",
          phase: "started",
          source: { source: "agent", tool_name: "apply_edl" },
          edl_text: "*** Begin EDL\n*** Trim Clip\n*** End EDL\n",
          snapshot: timeline,
          diff_hints: [{ kind: "trim_edge", op_index: 0, track_index: 0, item_index: 0, side: "right", delta_s: 1 }],
          summary: "Trim intro",
          revision: 0,
        });
        useAgentStore.getState().upsert({
          kind: "proposed_edit",
          id: "proposal-1",
          phase: "started",
          source: { source: "agent", tool_name: "apply_edl" },
          edl_text: "*** Begin EDL\n*** Trim Clip\n*** End EDL\n",
          snapshot: timeline,
          diff_hints: [],
          summary: "Trim intro",
          revision: 0,
        });
      }

      function seedAssessorRecommendation(overrides = {}) {
        const atS = overrides.atS ?? 8;
        useAgentStore.getState().upsert({
          kind: "tool_call",
          id: overrides.id ?? "assess-edit-quality-1",
          phase: "completed",
          name: "assess_edit_quality",
          args: { at_s: atS, kind: "cut", objective: overrides.intent ?? "speaker_handoff" },
          result: {
            Ok: JSON.stringify({
              at_s: atS,
              source_at_s: atS,
              kind: "cut",
              objective: overrides.intent ?? "speaker_handoff",
              asset_id: "raw/intro.mp4",
              continuity: {
                verdict: "risky",
                rules: [],
              },
              recommendation: {
                action: overrides.action ?? "use_j_cut",
                cut_type: overrides.cutType ?? "j_cut",
                intent: overrides.intent ?? "speaker_handoff",
                edl_op: overrides.edlOp ?? "Set Audio Lead",
                transition: null,
                broll: false,
                reason: overrides.reason ?? "Use a J-cut so incoming dialogue starts before picture.",
              },
              edl_guidance:
                overrides.edlGuidance ?? "*** Set Audio Lead with lead_s 0.35, then review by ear",
            }),
          },
        });
      }
      window.__seedAssessorRecommendation = seedAssessorRecommendation;

      createRoot(document.getElementById("root")).render(React.createElement(App));
      if (scenario === "proposal") {
        window.setTimeout(seedProposal, 250);
      } else if (scenario === "assessor") {
        window.setTimeout(seedAssessorRecommendation, 250);
      } else if (scenario === "transition") {
        window.setTimeout(() => {
          useTimelineSelectionStore.getState().select({ trackIndex: 0, clipIndex: 1 });
        }, 250);
      } else if (scenario === "editorial") {
        window.setTimeout(() => {
          useTimelineSelectionStore.getState().select({ trackIndex: 0, clipIndex: 2 });
        }, 250);
      } else if (scenario === "density") {
        window.setTimeout(() => {
          useTimelineSelectionStore.getState().select({ trackIndex: 0, clipIndex: 5 });
        }, 250);
      }
    </script>
  </body>
</html>
