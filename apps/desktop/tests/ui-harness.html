    <script type="module">
      import React from "react";

      import {

        mockIPC,

      import perfPreviewUrl from "./fixtures/perf-preview.mp4?url";

      const params = new URLSearchParams(window.location.search);
      const projectLoaded = params.get("project") === "1";
      const scenario = params.get("scenario") || "shell";
      const slowNonCritical = params.get("slowNonCritical") === "1";
      const projectRoot = "/tmp/montage-ui-eval";
      const nonCriticalIpc = new Set([
        "get_permission_mode",
        "get_project_episodes",
        "index_readiness",
        "list_chat_sessions",
        "list_generated_media",
        "load_chat_history",
        "read_disabled_indexers",
        "read_indexer_config",
        "read_media_readiness",

        "social_accounts",

      const timeline = {

        broadcast_overlay: null,
        cut_boundaries: [

          {

            reason: "Cutaway gives the viewer spatial context.",
          },
        ],
        preview_limitations: [
          {

            message: "Split-edit offsets are shown in the timeline but approximated in preview audio.",
          },
        ],
        tracks: [
          {
            name: "V1",
            kind: "video",
            role: null,
            audio: null,
            items: [
              {
                kind: "clip",

              },
              {

                out_offset_s: 0.25,
                effect_name: "montage.cross_dissolve",

                transition_direction: null,
                transition_energy: 0.22,
                audio_policy: "crossfade",
              },
              {
                kind: "clip",
                index: 2,
                name: "Context",
                clip_uuid: "clip-2",
                track_start_s: 6,
                duration_s: 4,
                asset_id: "raw/context.mp4",
                source_start_s: 0,
                proxy_path: perfPreviewUrl,
                playable_path: perfPreviewUrl,
                playable_kind: "source",
                thumbnail_dir: null,
                waveform_path: null,
                volume: null,
                speed: null,
                fade_in_s: null,
                fade_out_s: null,

              },
              {

              {

                color_correction: null,
                lut_path: null,

                split_edit_reason: null,
                split_edit_confidence: null,
              },
              {
                kind: "transition",
                index: 5,

                duration_s: 0.5,
                in_offset_s: 0.25,
                out_offset_s: 0.25,
                effect_name: "montage.flash_white",
                transition_id: "montage.flash_white",
                transition_family: "flash",

                transition_direction: null,

              },
              {

            ],
          },
          {
            name: "Titles",
            kind: "video",
            role: "titles",
            audio: null,
            items: [
              {
                kind: "clip",
                index: 0,
                name: "Opening Title",
                clip_uuid: "clip-title-1",

                proxy_path: null,

                fade_out_s: null,
                link_group_id: null,

                color_correction: null,
                lut_path: null,
                title: {
                  text: "Opening Title",
                  position: "center",
                  font_size: 64,
                  color: "#FFFFFF",
                  font_weight: "bold",
                  animation: "none",
                  reveal: "none",
                },
                video_overlay: null,
                motion_shape: null,
                motion_image: null,
                animations: [
                  {
                    id: "title-drift-existing",
                    target: {
                      clip_id: "clip-title-1",
                      parameter: "title.position",
                    },
                    keyframes: [
                      {
                        time_s: 0,
                        value: 0,
                        interpolation: "bezier",
                        easing: "ease_in_out",
                        bezier: {
                          out_x: 0.2,
                          out_y: 0,
                          in_x: 0.8,
                          in_y: 1,
                        },
                        tangent_mode: "aligned",
                        spring: null,
                      },
                      {
                        time_s: 4,
                        value: 1,
                        interpolation: "linear",
                        easing: "linear",
                        bezier: null,
                        tangent_mode: "auto",
                        spring: null,
                      },
                    ],
                    pre_extrapolation: "hold",
                    post_extrapolation: "hold",
                    motion_path: {
                      points: [
                        { time_s: 0, x: -0.04, y: 0.02 },
                        { time_s: 4, x: 0.04, y: -0.02 },
                      ],
                    },
                    rationale: "Existing title drift.",
                  },
                ],
                audio_lead_s: null,
                audio_trail_s: null,
                split_edit_reason: null,
                split_edit_confidence: null,
              },
            ],
          },
        ],
      };

      const notes = {
        version: 1,
        notes: [
          {
            id: "broll-1",
            kind: "broll_suggestion",
            status: "open",
            anchor_at_s: 3.2,
            summary: "Add city skyline cutaway",
            broll_query: "city skyline",
            broll_anchor: { kind: "clip_uuid", uuid: "clip-1" },
            broll_previews: [
              {
                pexels_id: 42,
                thumbnail_url:
                  "data:image/gif;base64,R0lGODlhAQABAAAAACw=",
                pexels_page: "https://example.invalid/pexels/42",
                attribution: "Pexels",
                duration_s: 3,
              },
            ],
          },
        ],
      };

      const commits = [
        {
          commitHash: "sha256:bbbbbbbbbbbbbbbb",
          timelineHash: "sha256:timeline2",
          timestamp: "2026-05-11T12:05:00Z",
          header: "Tighten intro",
          fullMessage: "Tighten intro\n\nAgent reasoning: remove dead air",
          parents: ["sha256:aaaaaaaaaaaaaaaa"],
        },
        {
          commitHash: "sha256:aaaaaaaaaaaaaaaa",
          timelineHash: "sha256:timeline1",
          timestamp: "2026-05-11T12:00:00Z",
          header: "Clean starting cut",
          fullMessage: "Clean starting cut",
          parents: [],
        },
      ];

      mockWindows("main");
      mockConvertFileSrc("macos");
      window.isTauri = true;
      window.__lastEdlText = "";
      window.__montageIpcCalls = [];
      const ipcStart = performance.now();
      let proposalCounter = 0;
      let useAgentStore;
      let useTimelineSelectionStore;
      let useProposalStore;
      mockIPC((cmd, args) => {
        window.__montageIpcCalls.push({
          command: cmd,
          atMs: performance.now() - ipcStart,
        });
        const reply = (value) => {
          if (!slowNonCritical || !nonCriticalIpc.has(cmd)) return value;
          return new Promise((resolve) => window.setTimeout(() => resolve(value), 2000));
        };
        switch (cmd) {
          case "current_project_root":
            return reply(projectLoaded ? projectRoot : null);
          case "recent_projects":
            return reply(projectLoaded ? [projectRoot] : []);
          case "read_timeline":
            return reply(timeline);
          case "list_notes":
            return reply(notes);
          case "list_source_media":
            return reply([
              {
                id: "raw/intro.mp4",
                name: "intro.mp4",
                path: `${projectRoot}/raw/intro.mp4`,
                size_bytes: 123456,
              },
            ]);
          case "list_proxies":
            return reply([]);
          case "media_url_for_path":
            return reply(perfPreviewUrl);
          case "read_transcript":
            return reply(null);
          case "list_generated_media":
            return reply([]);
          case "list_chat_sessions":
            return reply([]);
          case "load_chat_history":
            return reply({ items: [] });
          case "read_indexer_config":
            return reply({ disabled: [] });
          case "read_skill_config":
            return reply({ version: 2, disabled: [], pinned: [] });
          case "read_disabled_indexers":
            return reply([]);
          case "index_readiness":
            return reply(null);
          case "get_project_episodes":
            return reply({
              total: 0,
              accepted: 0,
              review_needed: 0,
              rejected: 0,
              episodes: [],
            });
          case "running_job_ids":
            return reply([]);
          case "read_media_readiness":
            return reply(null);
          case "social_accounts":
            return reply([]);
          case "list_vedit_commits":
            return reply(commits);
          case "diff_vedit_refs":
            return reply({
              fromRef: "sha256:aaaaaaaaaaaaaaaa",
              toRef: "sha256:bbbbbbbbbbbbbbbb",
              changeCount: 1,
              changedClipCount: 1,
              changedClipIds: ["clip-1"],
              changes: [{ kind: "Trimmed", clip_uuid: "clip-1" }],
              animationChanges: [],
            });
          case "restore_vedit_ref":
          case "set_menu_item_enabled":
          case "set_view_state":
          case "start_turn":
            return reply(null);
          case "accept_proposal":
          case "reject_proposal":
            useProposalStore?.getState().clear();
            return reply(null);
          case "propose_user_edit":
            window.__lastEdlText = args?.edlText ?? "";
            proposalCounter += 1;
            const proposalId = `proposal-ui-test-${proposalCounter}`;
            useProposalStore?.getState().ingest({
              kind: "proposed_edit",
              id: proposalId,
              phase: "started",
              source: { source: "user" },
              edl_text: window.__lastEdlText,
              snapshot: timeline,
              diff_hints: [],
              summary: "Assessor recommendation",
              revision: 0,
            });
            return reply(proposalId);
          case "get_permission_mode":
            return reply("ask");
          case "get_project_type":
            return reply("editorial");
          default:
            return reply(null);
        }
      }, { shouldMockEvents: true });

      const [
        { default: App },
        agentStoreModule,
        timelineSelectionModule,
        proposalStoreModule,
      ] = await Promise.all([
        import("/src/App.tsx"),
        import("/src/agent/store.ts"),
        import("/src/properties/store.ts"),
        import("/src/timeline/proposal.ts"),
      ]);
      useAgentStore = agentStoreModule.useAgentStore;
      useTimelineSelectionStore = timelineSelectionModule.useTimelineSelectionStore;
      useProposalStore = proposalStoreModule.useProposalStore;

      function seedProposal() {
        useProposalStore.getState().ingest({
          kind: "proposed_edit",
          id: "proposal-1",
          phase: "started",
          source: { source: "agent", tool_name: "apply_edl" },
          edl_text: "*** Begin EDL\n*** Trim Clip\n*** End EDL\n",
          snapshot: timeline,
          diff_hints: [{ kind: "trim_edge", op_index: 0, track_index: 0, item_index: 0, side: "right", delta_s: 1 }],
          summary: "Trim intro",
          revision: 0,
        });
        useAgentStore.getState().upsert({
          kind: "proposed_edit",
          id: "proposal-1",
          phase: "started",
          source: { source: "agent", tool_name: "apply_edl" },
          edl_text: "*** Begin EDL\n*** Trim Clip\n*** End EDL\n",
          snapshot: timeline,
          diff_hints: [],
          summary: "Trim intro",
          revision: 0,
        });
      }

      function seedAssessorRecommendation(overrides = {}) {
        const atS = overrides.atS ?? 8;
        useAgentStore.getState().upsert({
          kind: "tool_call",
          id: overrides.id ?? "assess-edit-quality-1",
          phase: "completed",
          name: "assess_edit_quality",
          args: { at_s: atS, kind: "cut", objective: overrides.intent ?? "speaker_handoff" },
          result: {
            Ok: JSON.stringify({
              at_s: atS,
              source_at_s: atS,
              kind: "cut",
              objective: overrides.intent ?? "speaker_handoff",
              asset_id: "raw/intro.mp4",
              continuity: {
                verdict: "risky",
                rules: [],
              },
              recommendation: {
                action: overrides.action ?? "use_j_cut",
                cut_type: overrides.cutType ?? "j_cut",
                intent: overrides.intent ?? "speaker_handoff",
                edl_op: overrides.edlOp ?? "Set Audio Lead",
                transition: null,
                broll: false,
                reason: overrides.reason ?? "Use a J-cut so incoming dialogue starts before picture.",
              },
              edl_guidance:
                overrides.edlGuidance ?? "*** Set Audio Lead with lead_s 0.35, then review by ear",
            }),
          },
        });
      }
      window.__seedAssessorRecommendation = seedAssessorRecommendation;

      createRoot(document.getElementById("root")).render(React.createElement(App));
      if (scenario === "proposal") {
        window.setTimeout(seedProposal, 250);
      } else if (scenario === "assessor") {
        window.setTimeout(seedAssessorRecommendation, 250);
      } else if (scenario === "transition") {
        window.setTimeout(() => {
          useTimelineSelectionStore.getState().select({ trackIndex: 0, clipIndex: 1 });
        }, 250);
      } else if (scenario === "editorial") {
        window.setTimeout(() => {
          useTimelineSelectionStore.getState().select({ trackIndex: 0, clipIndex: 2 });
        }, 250);
      } else if (scenario === "density") {
        window.setTimeout(() => {
          useTimelineSelectionStore.getState().select({ trackIndex: 0, clipIndex: 5 });
        }, 250);
      } else if (scenario === "title-motion") {
        window.setTimeout(() => {
          useTimelineSelectionStore.getState().select({ trackIndex: 1, clipIndex: 0 });
        }, 250);
      }
    </script>
  </body>
</html>
