[package]
name = "awidat-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Awidat — collaborative video editor with an agent inside"

[lib]
# Tauri convention: lib name must differ from bin name (Windows quirk
# per https://github.com/rust-lang/cargo/issues/8519).
name = "awidat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pin `tauri` to 2.11.x: tauri 2.10 + tauri-runtime-wry 2.11 (or
# vice-versa) ships a mismatched WebviewDispatch trait surface that
# fails to compile. Pinning the top-level crate forces cargo to resolve
# a consistent 2.11.x stack across tauri, tauri-runtime, tauri-runtime-wry.
# `tauri-build` and plugins are versioned independently and stay on `"2"`.
tauri-build = { version = "2", features = [] }

[features]
# Phase 5 (social-publishing): the secret-holding legacy local-publish stack
# (`publishing/{oauth_exchange,oauth_listener,keychain}` + the provider upload
# clients) is the OLD desktop-local path the server-backed `social_*` path now
# supersedes. The intent is to gate it off by default so the shipped binary
# holds no `client_secret` and runs no loopback OAuth listener.
#
# DEVIATION (documented for the parent reviewer): those modules are still wired
# into `commands/publishing.rs`, which backs the LIVE render-queue auto-upload
# UI (`apps/desktop/src/app/useRenderQueueWorker.ts` calls
# `set_render_upload_targets` / `start_uploads_for_job` / `poll_upload_states`).
# Per Phase 5 Step 6 / RECONCILIATION G7, code that live UI still depends on is
# left registered this phase; gating it now would break the render queue. So the
# feature exists as the seam for the Phase 6/7 cleanup but is a default-on no-op
# today — full deletion/gating lands once the render queue is migrated too.
default = ["legacy_local_publishing"]
legacy_local_publishing = []

[dependencies]
tauri = { version = "~2.11", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

# Awidat crates we wrap.
awidat-auth = { workspace = true }
awidat-codex-bridge = { workspace = true }
awidat-core = { workspace = true }
awidat-desktop-protocol = { workspace = true }
awidat-proto = { workspace = true }
awidat-config = { path = "../../../crates/config" }
awidat-index = { workspace = true }
awidat-mcp = { path = "../../../crates/mcp" }
awidat-render = { workspace = true }
awidat-render-gpu = { workspace = true }
awidat-secrets = { workspace = true }
awidat-social = { workspace = true }
base64 = "0.22"

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["net"] }
# `io` brings `ReaderStream`, used by `social_client::put_file` to stream a
# rendered artifact straight from disk into a signed-URL PUT body (so a
# multi-GB render never loads into RAM).
tokio-util = { workspace = true, features = ["io"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
keyring = { workspace = true, features = ["crypto-rust"] }
# OAuth token-exchange HTTP client. Uses the workspace `reqwest` with
# `rustls-tls` (the `json` feature pulls in serde plumbing for the
# `TokenResponse` deserialise) so we don't have to depend on system
# OpenSSL on macOS / Linux. The `cookies` and `stream` workspace
# features are unused here but harmless — they ride along for the
# render / index crates that share this dep.
reqwest = { workspace = true }

# Per-target keyring backends. Same matrix the rest of the workspace uses
# (mirrors `crates/secrets/Cargo.toml` and `vendor/codex-rs/keyring-store`):
# macOS Keychain Services, Windows Credential Manager, and the Linux
# `linux-native-async-persistent` combo (kernel keyutils + secret-service
# persistence) so credentials survive logout without forcing a synchronous
# D-Bus dependency.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-async-persistent"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = { workspace = true }
# Mocked HTTP server for OAuth token-exchange / refresh / userinfo
# unit tests so the test suite never reaches out to Google.
wiremock = { workspace = true }

# This crate intentionally does NOT inherit workspace lints. Tauri's
# generated code (via the `tauri::generate_handler!` macro) emits
# patterns that trip several of the workspace's deny-level clippy
# lints (`needless_borrow`, `redundant_closure`, etc) which we cannot
# `allow` because workspace lints are deny. Mirroring the pattern
# crates/tui already uses for the same reason.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
unwrap_used = "deny"
