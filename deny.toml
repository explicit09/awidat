[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/dzbarsky/rules_rust",
  "https://github.com/explicit09/vedit.git",
  "https://github.com/helix-editor/nucleo.git",
  "https://github.com/juberti-oai/rust-sdks.git",
  "https://github.com/nornagon/crossterm",
  "https://github.com/nornagon/ratatui",
  "https://github.com/openai-oss-forks/tokio-tungstenite",
  "https://github.com/openai-oss-forks/tungstenite-rs",
]

[bans]
# This task establishes license/advisory/source gates. Duplicate dependency
# cleanup is noisy in the vendored Codex/Tauri graph and should be handled as a
# separate dependency-consolidation effort.
#
# Investigated 2026-07-16 (R21): constant_time_eq duplicates at 0.1.5 and 0.3.1.
# `cargo tree -i constant_time_eq@0.1.5 --target all` shows the old copy comes
# from zip v0.6.6, a hard dependency of webrtc-sys-build (git-pinned rev in
# https://github.com/juberti-oai/rust-sdks.git), reached via vendor/codex-rs/
# realtime-webrtc -> codex-tui. `cargo update -p zip@0.6.6 --precise 2.4.2`
# fails: webrtc-sys-build requires `zip = "^0.6"` and is locked to a specific
# git rev we do not control. The 0.3.1 copy comes from
# vendor/codex-rs/app-server-transport's own dependency chain. This is a
# transitive-locked duplication in vendored/forked code, not our dependency
# chain — leaving multiple-versions = "allow" rather than attempting a broad
# dedup. Revisit when the juberti-oai/rust-sdks.git fork bumps webrtc-sys-build
# past zip 0.6, or when codex-rs upstream drops the constant_time_eq 0.3.1 path.
multiple-versions = "allow"
