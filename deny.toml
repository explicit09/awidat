[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/dzbarsky/rules_rust",
  "https://github.com/explicit09/vedit.git",
  "https://github.com/helix-editor/nucleo.git",
  "https://github.com/juberti-oai/rust-sdks.git",
  "https://github.com/nornagon/crossterm",
  "https://github.com/nornagon/ratatui",
  "https://github.com/openai-oss-forks/tokio-tungstenite",
  "https://github.com/openai-oss-forks/tungstenite-rs",
]

[bans]
# This task establishes license/advisory/source gates. Duplicate dependency
# cleanup is noisy in the vendored Codex/Tauri graph and should be handled as a
# separate dependency-consolidation effort.
multiple-versions = "allow"
